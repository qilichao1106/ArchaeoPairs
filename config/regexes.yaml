# regexes.yaml — 考古编号正则集中治理（单测覆盖全部变体）
# 由 eval/test_regexes.py 强制覆盖；变更即 rule_version+1

artifact_id:
  # 器物号：单位前缀(字母数字) : 序号；全角/半角冒号均可；圈号/子编号单独匹配
  standard: '([A-Z]{1,3}[A-Z0-9]*\d*)[:：]([0-9]+)'
  sub_number: '([A-Z]{1,3}[0-9]+)-([0-9]+)'        # 子编号式如 M4-2 保留
  circle_number: '([①②③④⑤⑥⑦⑧⑨⑩])'              # 层位圈号 → ASCII 序号

seq_in_image:
  # 图内序号：阿拉伯数字后接点或顿号
  dot: '^([0-9]{1,2})[.．]'
  comma: '^([0-9]{1,2})[、,]'

figure_note_forms:
  # 图注四形态（解析规范V §2 规则A）
  compact: '^(\d+)\.([^（(]+)(?:[:：]?)([A-Z0-9]+[:：][0-9]+)'   # 紧凑式 1.00FBG1:2
  fullwidth: '^(\d+)\.\s*([^（(]+)[（(]([A-Z0-9]+)[:：]([0-9]+)[)）]'  # 全角式 1.铁片(00FBF1：1)
  range: '^([0-9]+)[~～-]([0-9]+)\.\s'                             # 范围式 2～5. 按位置序展开
  same_id: '^([0-9]+[、,][0-9]+)\.\s'                              # 同号式 2、9.铁器(...) 拆Pair共享子图

body_ref:
  # 正文图引用 (图X，N) / (图版X，N)
  figure_ref: '（图([^，,]+)，\s*(\d+)）'
  plate_ref: '（图版([^，,]+)，\s*(\d+)）'

caption_mode_keywords:
  artifact: ['出土遗物', '遗物', '纹饰', '器物', '铜', '瓷', '陶', '铁', '玉']
  non_artifact: ['平面图', '剖面图', '平剖面图', '地层', '遗迹', '墓室', '探方', '区位图', '示意图', '分布图']
  plate: ['图版']

figure_no_chinese_map:
  # 中文数字→阿拉伯（图号归一）；含〇
  map: '〇|一|二|三|四|五|六|七|八|九|十|百'
  suffix: '([a-z]|[0-9]+[a-z])$'   # 字母后缀保留 图七a / 图2-1-16b

norm_rules:
  colon_fullwidth_to_half: true    # ：→ :
  colon_to_dash: true              # : → -（器物号命名）
  circle_to_ascii: true            # ②→2，original 保留
